name: Collect global news
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-news-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect and optionally ingest
        env:
          NEWS_INGEST_URL: ${{ secrets.NEWS_INGEST_URL }}
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: python collector/collect.py
      - name: Upload collection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-run-${{ github.run_id }}
          path: collector/latest_run.json
          retention-days: 14
